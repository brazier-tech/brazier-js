name: Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: 
          pnpm install
          pnpm ci
        env:
          NODE_ENV: development
      
      - name: Run vitest unit tests
        run: pnpm test